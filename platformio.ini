; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 9600
# Basis-Bibliotheken, die JEDER braucht
lib_deps = 
    Wire
    
[env:compass]
extends = common
build_src_filter = -<*> +<main_read_compass.cpp>
lib_deps = 
    ${common.lib_deps}
    adafruit/Adafruit HMC5883 Unified@^1.2.4
    adafruit/Adafruit Unified Sensor@^1.1.15
    arduino-libraries/Stepper@^1.1.3

[env:motor]
extends = common
build_src_filter = -<*> +<main_motor_driver.cpp>
lib_deps = 
    ${common.lib_deps}
    # Falls der Motor keinen Kompass braucht, kannst du HMC5883 hier weglassen



[env:compass_gy271]
extends = common
build_src_filter = -<*> +<main_read_compass_gy271.cpp>
lib_deps = 
    ${common.lib_deps}
    mprograms/QMC5883LCompass@^1.2.3